# Dependency review on pull requests (free on a public repository): fails when a pull request adds or updates a
# dependency with a known advisory of high or critical severity, across the NuGet, npm and GitHub Actions manifests.
# Read-only token; no pull request comment.
name: dependency-review

on:
  pull_request:

permissions: {}

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
