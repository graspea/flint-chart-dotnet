# The upstream watch bot (design part 4). Daily, it picks the next stable flint-chart version above the pin, runs the
# install gate, regenerates, tests, writes a change report and opens one pull request per upstream version on branch
# upstream/flint-chart-<version>. It never tags and never publishes: the maintainer merges, opens the release pull
# request and pushes the tag (release.yml).
#
# Job generate runs code from the upstream package, so it has a read-only token and no secrets. Every write goes
# through a GitHub App token minted in jobs open-pr and close-stale (environment upstream-sync, branch main only).
name: upstream-sync

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: flint-chart version to sync (default the lowest stable version above the pin that is not skipped)
        required: false
        type: string

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    outputs:
      version: ${{ steps.pick.outputs.version }}
      queued: ${{ steps.pick.outputs.queued }}
      stale-numbers: ${{ steps.pick.outputs.stale_numbers }}
      context: ${{ steps.pick.outputs.context }}
    steps:
      # Full history and tags: the report's clean-sync streak and stable-tag inputs read them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Validates every version string, lists the bot PRs once (opened by a bot, not from a fork), files the deduplicated
      # backport issues and writes the outputs and the step summary (also on days with nothing to do).
      - id: pick
        env:
          REQUESTED: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node generator/scripts/pick-upstream-version.mjs

  generate:
    needs: detect
    if: needs.detect.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FLINT_VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      # Outputs live outside the checkout so they never enter the patch.
      - run: |
          echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"
          cp generator/ir/flint-ir.json "$RUNNER_TEMP/out/flint-ir.old.json"
          cp generator/retired.json "$RUNNER_TEMP/out/retired.old.json"
      # The gate: install exact with --ignore-scripts, npm audit signatures, provenance identity, flint-chart-mcp and
      # the upstream ref into generator/mcp-pin.json. A failure stops the run before any package code executes.
      - working-directory: generator
        run: |
          npm ci --ignore-scripts
          npm run install-upstream -- "$FLINT_VERSION"
      # Forward-compat probe: the old model round-trips the new version's fixtures (counts go into the report).
      - id: forward
        continue-on-error: true
        run: |
          npm --prefix generator run fixtures
          dotnet test tests/Graspea.Flint.ContractTests -f net10.0 --filter Category=RoundTrip \
            --logger "trx;LogFileName=forward.trx" --results-directory "$OUT/forward"
      # A generation failure is recorded, not fatal: the pull request carries the log as a draft.
      - id: gen
        run: |
          set +e
          npm --prefix generator run generate > "$OUT/generate.log" 2>&1
          code=$?
          cat "$OUT/generate.log"
          if [ "$code" -eq 0 ]; then echo "result=ok"; else echo "result=failed"; fi >> "$GITHUB_OUTPUT"
      - id: tests-dotnet
        continue-on-error: true
        run: dotnet test
      - id: tests-generator
        continue-on-error: true
        working-directory: generator
        run: npm test
      - env:
          CONTEXT: ${{ needs.detect.outputs.context }}
          GENERATION: ${{ steps.gen.outputs.result }}
          FORWARD: ${{ steps.forward.outcome }}
          TESTS_DOTNET: ${{ steps.tests-dotnet.outcome }}
          TESTS_GENERATOR: ${{ steps.tests-generator.outcome }}
          FLINT_M2_DONE: ${{ vars.FLINT_M2_DONE }}
        # The pin files and the new fixture folder always change, so an empty patch is impossible. The signal that the
        # generator missed the new version is a successful generation that left the generated C# untouched: every
        # generated file names the upstream version in its header.
        run: |
          if [ "$GENERATION" = ok ] && git diff --quiet -- src/Graspea.Flint/Generated; then
            echo "generation succeeded but src/Graspea.Flint/Generated did not change for flint-chart $FLINT_VERSION" >&2
            exit 1
          fi
          git add -N .
          npm --prefix generator run upstream-report -- --old-ir "$OUT/flint-ir.old.json" --old-retired "$OUT/retired.old.json" --out "$OUT"
          git diff --binary > "$OUT/upstream.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-${{ needs.detect.outputs.version }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  open-pr:
    needs: [detect, generate]
    runs-on: ubuntu-latest
    environment: upstream-sync
    # Checkout only; every write uses the App token. No npm or dotnet command runs in this job, only the path check
    # from main's checkout.
    permissions:
      contents: read
    env:
      FLINT_VERSION: ${{ needs.detect.outputs.version }}
      # The only paths a sync may change: create-pull-request commits them (add-paths), and check-sync-paths.mjs fails
      # the job when the patch touches anything else. An exact path, or a folder followed by /**.
      SYNC_PATHS: |
        generator/package.json
        generator/package-lock.json
        generator/mcp-pin.json
        generator/ir/**
        generator/retired.json
        src/**
        tests/fixtures/**
        README.md
        docs/package/AGENTS.md
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.UPSTREAM_SYNC_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_SYNC_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upstream-${{ needs.detect.outputs.version }}
          path: ${{ runner.temp }}/out
      - id: meta
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          echo "draft=$(jq -r '(.tests != "success") or (.generation != "ok")' "$RUNNER_TEMP/out/result.json")" >> "$GITHUB_OUTPUT"
          echo "labels=$(jq -r '.labels | join(",")' "$RUNNER_TEMP/out/result.json")" >> "$GITHUB_OUTPUT"
          id=$(gh api "users/${SLUG}%5Bbot%5D" --jq .id)
          echo "identity=${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
      # Working tree only, not the index: create-pull-request commits the whole index after adding add-paths, so a staged
      # path outside the allowlist would be committed. The check refuses such a patch outright.
      - run: |
          git apply "$RUNNER_TEMP/out/upstream.patch"
          node generator/scripts/check-sync-paths.mjs
      # Creates the pull request, or force-updates the branch and the open pull request on a rerun; no change, no push.
      - id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          branch: upstream/flint-chart-${{ needs.detect.outputs.version }}
          commit-message: Sync flint-chart ${{ needs.detect.outputs.version }}
          author: ${{ steps.meta.outputs.identity }}
          committer: ${{ steps.meta.outputs.identity }}
          title: 'Upstream: flint-chart ${{ needs.detect.outputs.version }}'
          body-path: ${{ runner.temp }}/out/pr-body.md
          labels: ${{ steps.meta.outputs.labels }}
          draft: ${{ steps.meta.outputs.draft }}
          add-paths: ${{ env.SYNC_PATHS }}
      # On an existing pull request the action updates only the title and body: it adds labels but never removes them,
      # and draft applies at creation. Bring the computed labels and the draft state up to date on every run.
      - if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          LABELS: ${{ steps.meta.outputs.labels }}
          DRAFT: ${{ steps.meta.outputs.draft }}
        run: |
          current=$(gh pr view "$PR" --json labels --jq '.labels[].name')
          for label in breaking needs-attention; do
            case ",$LABELS," in *",$label,"*) continue ;; esac
            if printf '%s\n' "$current" | grep -qx "$label"; then gh pr edit "$PR" --remove-label "$label"; fi
          done
          if [ "$(gh pr view "$PR" --json isDraft --jq .isDraft)" != "$DRAFT" ]; then
            if [ "$DRAFT" = true ]; then gh pr ready "$PR" --undo; else gh pr ready "$PR"; fi
          fi

  close-stale:
    needs: detect
    if: needs.detect.outputs.stale-numbers != ''
    runs-on: ubuntu-latest
    environment: upstream-sync
    permissions: {}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.UPSTREAM_SYNC_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_SYNC_APP_KEY }}
          permission-pull-requests: write
      # STALE holds the numbers of the bot's own open pull requests, separated by spaces; a branch name could also match a
      # pull request the bot did not open.
      - env:
          STALE: ${{ needs.detect.outputs.stale-numbers }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for n in $STALE; do
            gh pr close "$n" --comment "This flint-chart version is no longer a stable published version above the pin; closing."
          done

  report-failure:
    needs: [detect, generate, open-pr, close-stale]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FLINT_VERSION: ${{ needs.detect.outputs.version }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # One issue per version (or "detect" when no version is known), found by title; later failures comment on it.
      - run: |
          title="upstream sync failed: ${FLINT_VERSION:+flint-chart }${FLINT_VERSION:-detect}"
          body="Run: $RUN_URL"
          if [ -n "$FLINT_VERSION" ]; then body="$body"$'\n'"Artifact with the patch and the report, when the generate job finished: upstream-$FLINT_VERSION"; fi
          n=$(gh issue list --label upstream --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Failed again. $body"
          else
            gh issue create --title "$title" --label upstream,needs-attention --body "$body"
          fi
