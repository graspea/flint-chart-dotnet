# Keeps the action SHA pins and the test and generator tooling current. The weekly activity also keeps the scheduled
# upstream-sync workflow from being disabled after 60 days without repository activity (design part 4). flint-chart in
# generator/ is never updated here: upstream-sync.yml owns that pin, because a bump needs the gate and regeneration.
# Major versions are ignored: they change APIs the generator and the tests rely on (the TypeScript compiler API,
# @types/node following the Node major in .nvmrc, NUnit), so a major bump is a deliberate, reviewed change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /generator
    schedule:
      interval: weekly
    ignore:
      - dependency-name: flint-chart
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      generator:
        patterns: ["*"]
